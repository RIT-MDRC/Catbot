[project]
name = "catbot-policy-inference"
version = "0.1.0"
description = "Python 3.14 inference environment, independent of ROS Python"
requires-python = ">=3.14,<3.15"
dependencies = ["torch==2.14.0"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
